name: Build and deploy BriThe3DGuy.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install content builder dependencies
        run: python -m pip install -r requirements.txt

      - name: Build content from Markdown
        run: python tools/build_content.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'content/' \
            --exclude 'tools/' \
            --exclude 'requirements.txt' \
            --exclude 'update-content-data.bat' \
            --exclude 'update-tutorial-data.bat' \
            --exclude 'CONTENT_AUDIT.md' \
            --exclude 'CONTENT_SYSTEM_README.md' \
            --exclude 'TUTORIAL_DATA_README.md'
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
